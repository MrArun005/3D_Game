<!doctype html><html><body style="margin:0;background:transparent">
<canvas id="c" width="512" height="512"></canvas>
<script>
// An original orange "thinking" spark: 12 rounded rays of uneven length that
// breathe in a chasing wave while the whole spark turns slowly. One second loop.
const c = document.getElementById('c'), g = c.getContext('2d');
const N = 12, BASE = [1, .72, .9, .66, .95, .7, .88, .64, .97, .74, .86, .68];
window.draw = (t) => {            // t in [0,1)
  g.clearRect(0, 0, 512, 512);
  g.save(); g.translate(256, 256); g.rotate(t * Math.PI * 2 / N * 2);
  for (let i = 0; i < N; i++) {
    const wave = 0.5 + 0.5 * Math.cos(2 * Math.PI * (t * 2 - i / N));
    const L = 150 * BASE[i] * (0.62 + 0.38 * wave);
    const a = i * 2 * Math.PI / N;
    const w = 30 - 6 * (1 - BASE[i]);
    g.save(); g.rotate(a);
    g.fillStyle = '#e07a52';
    g.beginPath(); g.roundRect(-w / 2, -34 - L - w / 2, w, L + w, w / 2); g.fill();
    g.restore();
  }
  g.fillStyle = '#e07a52'; g.beginPath(); g.arc(0, 0, 46, 0, Math.PI * 2); g.fill();
  g.restore();
  // One colour everywhere, even where transparent, so downscaling never
  // averages the orange edges with black.
  const img = g.getImageData(0, 0, 512, 512), d = img.data;
  for (let i = 0; i < d.length; i += 4) { d[i] = 0xe0; d[i + 1] = 0x7a; d[i + 2] = 0x52; }
  g.putImageData(img, 0, 0);
};
window.ready = true;
</script></body></html>
