<!doctype html><html><body style="margin:0;background:transparent">
<canvas id="c" width="512" height="512"></canvas>
<script>
// The orange pixel critter, running. 16 x 11 cells: body, side nubs, two eyes,
// four legs that scurry in alternating pairs. Two loops:
//   draw('place', t)  runs on the spot, 512 x 512
//   draw('around', t) runs across a 1024 x 384 strip, turns, runs back
const c = document.getElementById('c'), g = c.getContext('2d');
const ORANGE = '#cc7f61', TOP = '#dd9a80', EYE = '#111111';
// Proportions after the reference: a near-square body (9 x 8 cells), a nub on
// each side, two tall eyes set wide, four long thin legs in two pairs.
// Grid is 11 x 11 cells: nubs in columns 0 and 10, body 1..9, legs below row 8.
const GW = 11;
function sprite(ox, oy, cell, t, dir) {
  const px = (x, y, w, h, col) => {
    const X = dir > 0 ? x : GW - x - w;
    g.fillStyle = col; g.fillRect(Math.round(ox + X * cell), Math.round(oy + y * cell), Math.ceil(w * cell), Math.ceil(h * cell));
  };
  const frame = Math.floor(t * 12) % 4;              // 4-step scurry
  const bob = [0, -0.35, 0, -0.35][frame];
  px(1, bob, 9, 8, ORANGE); px(1, bob, 9, 0.35, TOP);
  px(0, 3 + bob, 1, 2.4, ORANGE); px(10, 3 + bob, 1, 2.4, ORANGE);
  // Legs: outer pair flush with the body edges, inner pair one cell in. A and B alternate.
  for (const [lx, pair] of [[1, 0], [3, 1], [7, 0], [9, 1]]) {
    const up = frame < 2 ? pair === 0 : pair === 1;
    px(lx + (up ? 0.3 : 0), 8 + bob, 0.95, up ? 2.2 : 2.8, ORANGE);
  }
  const blink = (t % 2.4) > 2.28;
  const eh = blink ? 0.35 : 1.4, ey = 3.1 + bob + (blink ? 0.6 : 0);
  px(1.9, ey, 1.1, eh, EYE); px(8.0, ey, 1.1, eh, EYE);
}
function dust(x, y, t, dir) {
  for (let i = 0; i < 3; i++) {
    const k = ((t * 3 + i / 3) % 1);
    if (k > 0.7) continue;
    g.fillStyle = '#cfc6bc';
    const s = Math.round((18 - 10 * k) / 6) * 6;
    g.fillRect(Math.round(x - dir * (20 + 60 * k)), Math.round(y - 10 - 18 * k * (i % 2 ? 1 : 0.5)), s, s);
  }
}
window.draw = (mode, t) => {
  g.clearRect(0, 0, c.width, c.height);
  if (mode === 'place') {
    const cell = 36;
    dust(256 - 5.5 * cell + 10, 430, t, 1);
    sprite(256 - 5.5 * cell, 430 - 10.8 * cell, cell, t, 1);
  } else {
    // Out and back in one loop (t 0..1), easing into each turn.
    const cell = 20, w = GW * cell, span = c.width - w - 40;
    const phase = t < 0.5 ? t * 2 : (1 - t) * 2;
    const e = phase < 0.5 ? 2 * phase * phase : 1 - 2 * (1 - phase) ** 2;
    const dir = t < 0.5 ? 1 : -1;
    const x = 20 + span * e;
    dust(x + (dir > 0 ? 30 : w - 30), 340, t * 3, dir);
    sprite(x, 340 - 10.8 * cell, cell, t * 3, dir);
  }
};
window.ready = true;
</script></body></html>
